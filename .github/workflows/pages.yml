name: Deploy Garage Atlas Community
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cat support-files.zip.part-* > /tmp/garage-support.zip && unzip -q /tmp/garage-support.zip
      - name: Restore sourced comparison photos and checks
        run: |
          for archive in comparison-assets-*.zip; do
            if [ -f "$archive" ]; then unzip -oq "$archive"; fi
          done
      - run: node --test tests/*.test.mjs
      - run: mkdir _site && cp *.html *.js *.mjs *.css *.json _site/ && cp -r assets _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
